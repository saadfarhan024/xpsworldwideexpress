<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Go Delivery Express — Open Graph image</title>
    <style>
      :root {
        --navy: #163e6a;
        --orange: #ec8123;
        --ink: #111820;
      }

      * { box-sizing: border-box; }

      html,
      body {
        width: 1200px;
        height: 630px;
        margin: 0;
        overflow: hidden;
      }

      body {
        color: white;
        font-family: Arial, Helvetica, sans-serif;
      }

      .og-card {
        isolation: isolate;
        position: relative;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background:
          linear-gradient(90deg, rgba(7, 13, 22, 0.95) 0%, rgba(10, 20, 33, 0.84) 45%, rgba(8, 15, 25, 0.48) 100%),
          linear-gradient(0deg, rgba(3, 8, 15, 0.62), transparent 56%),
          url("https://xpsworldwideexpress.pk/img/theme_image_23.jpg") center 55% / cover no-repeat;
      }

      .top-accent {
        position: absolute;
        z-index: -1;
        inset: 0 0 auto;
        height: 10px;
        background: var(--orange);
      }

      .route-line {
        position: absolute;
        z-index: -1;
        right: -90px;
        top: 20px;
        width: 645px;
        height: 645px;
        border: 2px solid rgba(255, 255, 255, 0.18);
        border-radius: 50%;
        box-shadow: 0 0 0 36px rgba(22, 62, 106, 0.24), 0 0 0 74px rgba(255, 255, 255, 0.05);
      }

      .route-line::after {
        content: "";
        position: absolute;
        left: 98px;
        top: 9px;
        width: 16px;
        height: 16px;
        border: 4px solid var(--orange);
        border-radius: 50%;
        background: var(--navy);
      }

      .content {
        display: flex;
        height: 100%;
        flex-direction: column;
        padding: 42px 72px 36px;
      }

      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .logo-lockup {
        width: 152px;
        border-radius: 8px;
        background: white;
        padding: 8px 10px;
      }

      .logo-lockup img {
        display: block;
        width: 100%;
        height: auto;
      }

      .label {
        margin: 0;
        color: #f2a45e;
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      .headline {
        max-width: 735px;
        margin: 104px 0 18px;
        font-size: 64px;
        font-weight: 500;
        letter-spacing: -0.045em;
        line-height: 0.98;
      }

      .headline em {
        color: var(--orange);
        font-style: normal;
      }

      .description {
        max-width: 620px;
        margin: 0;
        color: rgba(255, 255, 255, 0.88);
        font-size: 21px;
        line-height: 1.45;
      }

      .footer {
        display: flex;
        align-items: center;
        gap: 15px;
        margin-top: 31px;
        color: rgba(255, 255, 255, 0.92);
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      .footer::before {
        content: "";
        width: 45px;
        height: 2px;
        background: var(--orange);
      }

      .service-panel {
        position: absolute;
        right: 54px;
        bottom: 48px;
        width: 294px;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.24);
        border-radius: 20px 6px 42px 6px;
        background: rgba(10, 27, 48, 0.78);
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.22);
        backdrop-filter: blur(8px);
      }

      .service-panel__top {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 15px 18px 12px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.14);
        color: var(--orange);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      .service-panel__top span {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--orange);
        box-shadow: 0 0 0 5px rgba(236, 129, 35, 0.15);
      }

      .service-list {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        padding: 14px 18px 17px;
      }

      .service-list span {
        border: 1px solid rgba(255, 255, 255, 0.22);
        border-radius: 3px;
        padding: 7px 9px;
        color: rgba(255, 255, 255, 0.9);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <!-- Render this page at 1200 × 630 and export it as PNG for social sharing. -->
    <main class="og-card" aria-label="Go Delivery Express social share card">
      <div class="top-accent"></div>
      <div class="route-line"></div>

      <div class="content">
        <header class="header">
          <div class="logo-lockup">
            <img src="logo.png" alt="Go Delivery Express" />
          </div>
          <p class="label">Worldwide logistics</p>
        </header>

        <section>
          <h1 class="headline">Full sustainable<br />cargo <em>solutions.</em></h1>
          <p class="description">
            Reliable courier, cargo, freight and fulfillment services that keep your business moving forward.
          </p>
        </section>

        <footer class="footer">Go Delivery Express</footer>
      </div>

      <aside class="service-panel" aria-label="Available logistics services">
        <div class="service-panel__top"><span></span> Moving worldwide</div>
        <div class="service-list">
          <span>Courier</span>
          <span>Cargo</span>
          <span>Freight</span>
          <span>Fulfillment</span>
        </div>
      </aside>
    </main>
  </body>
</html>
